<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#06080c"/>
    </linearGradient>
    <linearGradient id="curveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <path d="M 0 470 L 60 455 L 120 462 L 180 430 L 240 442 L 300 410 L 360 398 L 420 415 L 480 380 L 540 360 L 600 372 L 660 340 L 720 320 L 780 295 L 840 305 L 900 270 L 960 248 L 1020 235 L 1080 215 L 1140 200 L 1200 178 L 1280 160 L 1280 640 L 0 640 Z"
        fill="url(#curveFill)"/>
  <path d="M 0 470 L 60 455 L 120 462 L 180 430 L 240 442 L 300 410 L 360 398 L 420 415 L 480 380 L 540 360 L 600 372 L 660 340 L 720 320 L 780 295 L 840 305 L 900 270 L 960 248 L 1020 235 L 1080 215 L 1140 200 L 1200 178 L 1280 160"
        fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" fill="#ffffff">
    <text x="100" y="340" font-size="88" font-weight="600" letter-spacing="-2">Investment Assistant</text>
    <text x="100" y="395" font-size="22" font-weight="300" fill="#ffffff" fill-opacity="0.5" letter-spacing="3">PORTFOLIO · REALTIME · AI</text>
  </g>

  <g transform="translate(1180, 60)">
    <circle cx="0" cy="0" r="6" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-18" y="5" text-anchor="end" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.55" letter-spacing="1.5">LIVE</text>
  </g>
</svg>
